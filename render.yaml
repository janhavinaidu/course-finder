services:
  - type: web
    name: course-recommender-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
        # 💡 Set this in the Render dashboard to:
        # https://course-finder-six-indol.vercel.app,http://localhost:5173